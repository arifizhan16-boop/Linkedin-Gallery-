<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.1">
    <circle cx="1420" cy="200" r="120"/>
    <circle cx="180" cy="700" r="100"/>
    <circle cx="800" cy="450" r="300"/>
  </g>
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="62" fill="#ffffff" font-weight="bold" opacity="0.9">Embracing remote work</text>
  <g transform="translate(120, 300)">
    <rect width="1360" height="420" rx="16" fill="#ffffff"/>
    <g>
      <rect x="40" y="40" width="420" height="150" rx="12" fill="#dbeafe"/>
      <text x="70" y="90" font-family="Arial, sans-serif" font-size="24" fill="#1e293b" font-weight="bold">Morning standup</text>
      <circle cx="70" cy="140" r="20" fill="#3b82f6"/>
      <circle cx="120" cy="140" r="20" fill="#6366f1"/>
      <circle cx="170" cy="140" r="20" fill="#a855f7"/>
      <circle cx="220" cy="140" r="20" fill="#0ea5e9"/>
    </g>
    <g>
      <rect x="480" y="40" width="420" height="150" rx="12" fill="#f1f5f9"/>
      <text x="510" y="90" font-family="Arial, sans-serif" font-size="24" fill="#1e293b" font-weight="bold">Async updates</text>
      <rect x="510" y="120" width="340" height="30" rx="8" fill="#cbd5e1"/>
      <rect x="510" y="158" width="280" height="30" rx="8" fill="#cbd5e1"/>
    </g>
    <g>
      <rect x="920" y="40" width="400" height="150" rx="12" fill="#dcfce7"/>
      <text x="950" y="90" font-family="Arial, sans-serif" font-size="24" fill="#1e293b" font-weight="bold">Deep work blocks</text>
      <rect x="950" y="120" width="140" height="60" rx="8" fill="#22c55e"/>
      <rect x="1110" y="120" width="60" height="60" rx="8" fill="#86efac"/>
      <rect x="1190" y="120" width="90" height="60" rx="8" fill="#4ade80"/>
    </g>
    <rect x="40" y="230" width="1280" height="1" fill="#e2e8f0"/>
    <text x="40" y="300" font-family="Arial, sans-serif" font-size="34" fill="#0f172a" font-weight="bold">Key lessons after 2 years</text>
    <g font-family="Arial, sans-serif" font-size="26" fill="#475569">
      <text x="40" y="352">1. Over-communicate, and then communicate again.</text>
      <text x="40" y="396">2. Default to video, but respect async time.</text>
      <text x="40" y="440">3. Trust your team and measure outcomes, not hours.</text>
    </g>
  </g>
